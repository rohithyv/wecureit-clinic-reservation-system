services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cdex
      POSTGRES_USER: cdex
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-dev-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdex"]
      interval: 5s
      retries: 12
    volumes:
      - cdex-db:/var/lib/postgresql/data
  api:
    build: .
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DB_URL: jdbc:postgresql://db:5432/cdex
      DB_USER: cdex
      DB_PASSWORD: ${DB_PASSWORD:-local-dev-only}
      PAYER_PASSWORD: ${PAYER_PASSWORD:-local-payer-password}
      PROVIDER_PASSWORD: ${PROVIDER_PASSWORD:-local-provider-password}
volumes:
  cdex-db:
